# Alembic config — VisionSetil SQLite (audit residual: formal migrations)
# Usage:
#   cd backend
#   alembic revision --autogenerate -m "describe change"
#   alembic upgrade head
#
# Dev still runs lightweight ADD COLUMN on boot (database.py) for local DX.
# Production / CI should prefer: alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url = sqlite:///./mushroom_photo_id.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
